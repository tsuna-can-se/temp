name: Dependabot 自動マージ

on:
  workflow_run:
    workflows:
      - "CI for pr"
      - "Dependabot auto-approve"
    types:
      - completed
jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR URL
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const wr = context.payload.workflow_run;

            // 1) まずは payload 内の pull_requests を試す
            const prs = wr.pull_requests || [];
            if (prs.length > 0 && prs[0].html_url) {
              core.setOutput('url', prs[0].html_url);
              core.setOutput('number', prs[0].number?.toString() ?? '');
              console.log(`Found PR from workflow_run payload: ${prs[0].html_url}`);
              return;
            }

            // 2) 無ければ head_sha から「そのコミットに紐づくPR」を引く
            const sha = wr.head_sha;
            console.log(`Fetching PR for head_sha=${sha}...`);
            const { data } = await github.request(
              'GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls',
              { owner: context.repo.owner, repo: context.repo.repo, commit_sha: sha }
            );

            if (!data || data.length === 0) {
              core.setFailed(`PR not found for head_sha=${sha}. (fork PRだと紐づきが取れない等の可能性あり)`);
              console.log(`PR not found for head_sha=${sha}. (fork PRだと紐づきが取れない等の可能性あり)`);
              return;
            }

            core.setOutput('url', data[0].html_url);
            core.setOutput('number', data[0].number.toString());
            console.log(`Found PR from head_sha: ${data[0].html_url}`);

      - name: GitHub Appトークンを取得
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf  # v2.2.1
        with:
          app-id: ${{ secrets.AUTO_APPROVE_GH_APP_ID }}
          private-key: ${{ secrets.AUTO_APPROVE_GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: パッチ／マイナー更新の場合はsquashマージを実行
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
